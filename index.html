<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Manager — 4CAD Group</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/header.css">
<link rel="stylesheet" href="styles/gantt.css">
<link rel="stylesheet" href="styles/panels.css">
<link rel="stylesheet" href="styles/resources.css">
<script type="module" src="scripts/firebase.js"></script>
</head>
<body>

<!-- ══════════════════════════════════════════════
     ÉCRAN DE LOGIN
     ══════════════════════════════════════════════ -->
<div id="loginScreen" style="
  position:fixed; inset:0; z-index:9999;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center;">
  <div style="
    background:var(--surface);
    border:1px solid var(--border);
    border-top:4px solid var(--accent);
    border-radius:10px;
    padding:40px 36px;
    width:360px;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    font-family:Arial,sans-serif;">

    <!-- Titre -->
    <div style="text-align:center; margin-bottom:28px;">
      <div style="font-size:18px; font-weight:700; color:var(--text); letter-spacing:2px; text-transform:uppercase;">
        Project <span style="color:var(--accent)">Manager</span>
      </div>
      <div style="font-size:10px; color:var(--muted); letter-spacing:1px; margin-top:4px;">4CAD Group</div>
    </div>

    <!-- Email -->
    <div style="margin-bottom:12px;">
      <label style="font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
                    color:var(--muted); display:block; margin-bottom:5px;">Email</label>
      <input id="loginEmail" type="email" placeholder="prenom.nom@email.com"
        style="width:100%; padding:9px 11px; border-radius:5px;
               border:1px solid var(--border); background:var(--surface2);
               color:var(--text); font-size:13px; font-family:Arial,sans-serif;
               outline:none; box-sizing:border-box; transition:border-color .15s;"
        onfocus="this.style.borderColor='var(--accent)'"
        onblur="this.style.borderColor='var(--border)'">
    </div>

    <!-- Mot de passe -->
    <div style="margin-bottom:6px;">
      <label style="font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
                    color:var(--muted); display:block; margin-bottom:5px;">Mot de passe</label>
      <input id="loginPwd" type="password" placeholder="••••••••"
        style="width:100%; padding:9px 11px; border-radius:5px;
               border:1px solid var(--border); background:var(--surface2);
               color:var(--text); font-size:13px; font-family:Arial,sans-serif;
               outline:none; box-sizing:border-box; transition:border-color .15s;"
        onfocus="this.style.borderColor='var(--accent)'"
        onblur="this.style.borderColor='var(--border)'"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>

    <!-- Erreur -->
    <div id="loginError" style="min-height:18px; font-size:11px; color:#c0392b;
                                  margin-bottom:14px; font-family:Arial,sans-serif;"></div>

    <!-- Bouton -->
    <button id="loginBtn" onclick="doLogin()"
      style="width:100%; background:var(--accent); color:#fff; border:none;
             border-radius:5px; padding:11px; font-size:13px; font-weight:700;
             cursor:pointer; font-family:Arial,sans-serif; transition:background .15s;
             box-sizing:border-box;"
      onmouseover="this.style.background='var(--accent-dark)'"
      onmouseout="this.style.background='var(--accent)'">
      Se connecter
    </button>

  </div>
</div>

<!-- ══════════════════════════════════════════════
     APPLICATION (masquée jusqu'à auth)
     ══════════════════════════════════════════════ -->

    <div class="logo-divider"></div>
    <div class="logo-title">Project <span>manager</span></div>
  </div>
  <nav class="nav-tabs">
    <button class="nav-tab active" data-view="projets" onclick="switchView('projets')">
      <span class="nav-tab-icon">📊</span> Projets
    </button>
    <button class="nav-tab" data-view="ressources" onclick="switchView('ressources')">
      <span class="nav-tab-icon">👤</span> Ressources
    </button>
  </nav>
  <div class="toolbar">
    <span id="fbStatus" style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;background:var(--surface2);color:var(--muted);display:inline-flex;align-items:center;gap:5px;cursor:default">⏳ Firebase...</span>
    <span id="connectedUser" style="font-size:11px;color:var(--muted);padding:3px 8px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    <button class="btn-theme" id="btnTheme" onclick="toggleTheme()">🌙 Sombre</button>
    <button class="btn-theme" onclick="window._fbSignOut && window._fbSignOut()" title="Se déconnecter" style="color:var(--muted);">🚪 Déconnexion</button>
  </div>
</header>

<div id="tooltip" style="left: 1373px; top: 150px; display: none;"></div>
<div id="colorPopup" style="display: none;">
  <div class="cp-title" id="cpTitle">Couleur</div>
  <div class="color-grid" id="colorGrid"></div>
  <input type="color" id="cpCustom">
</div>
<div class="panel-backdrop" id="panelBackdrop" onclick="closeAllPanels()"></div>
<div class="edit-panel" id="editPanel">
  <div class="edit-panel-header">
    <span class="edit-panel-title" id="epTitle">+ Nouvelle tâche</span>
    <button class="edit-panel-close" onclick="closeEditPanel()">✕</button>
  </div>
  <div class="edit-panel-body">
    <div class="ep-group" style="display:none">
      <label class="ep-label">Projet</label>
      <select class="ep-input" id="epProjetSelect" onchange="onEpProjetSelectChange()" style="appearance:auto"></select>
      <input class="ep-input" id="epProjetCustom" type="text" placeholder="Nom du nouveau projet…" style="display:none;margin-top:4px;font-size:11px">
    </div>
    <div id="epNiveauxContainer"></div>
    <div class="ep-group" style="margin-top:2px">
      <label class="ep-label" id="epTacheLabel">Tâche</label>
      <input class="ep-input" id="epTache" type="text" placeholder="Description de la tâche">
    </div>
    <div class="ep-group ep-row">
      <div>
        <label class="ep-label">Début</label>
        <input class="ep-input" id="epDebut" type="date" onchange="onEpDebutChange()">
      </div>
      <div>
        <label class="ep-label">Fin</label>
        <input class="ep-input" id="epFin" type="date" onchange="onEpFinChange()">
      </div>
    </div>
    <div class="ep-group">
      <label class="ep-label">Charge (jours)</label>
      <input class="ep-input" id="epCharge" type="number" step="0.5" min="0" placeholder="ex: 2.5">
    </div>
    <div class="ep-group" id="epExternalIdGroup" style="display:none">
      <label class="ep-label">Task ID</label>
      <div class="ep-id-row">
        <input class="ep-input ep-input-id" id="epExternalId" type="text" readonly tabindex="-1">
        <span class="sync-badge" id="epSyncBadge" style="display:none" title="Synchronisé avec les données ressources">✓ sync</span>
      </div>
    </div>
  </div>
  <div class="edit-panel-footer">
    <button class="ep-btn-delete" id="epDeleteBtn" onclick="deleteFromPanel()" style="display:none">🗑 Supprimer</button>
    <button class="ep-btn-cancel" onclick="closeEditPanel()">Annuler</button>
    <button class="ep-btn-save" onclick="saveEditPanel()">✓ Enregistrer</button>
  </div>
</div>
<!-- JALON PANEL -->
<div class="edit-panel" id="jalonPanel">
  <div class="edit-panel-header">
    <span class="edit-panel-title" id="jpTitle">◆ Nouveau jalon</span>
    <button class="edit-panel-close" onclick="closeJalonPanel()">✕</button>
  </div>
  <div class="edit-panel-body">
    <div class="ep-group">
      <label class="ep-label">Projet</label>
      <select class="ep-input" id="jpProjetSelect" onchange="onJpProjetSelectChange()" style="appearance:auto"></select>
      <input class="ep-input" id="jpProjetCustom" type="text" placeholder="Nom du nouveau projet…" style="display:none;margin-top:4px;font-size:11px">
    </div>
    <div class="ep-group">
      <label class="ep-label">Nom du jalon</label>
      <input class="ep-input" id="jpNom" type="text" placeholder="ex: Mise en production">
    </div>
    <div class="ep-group">
      <label class="ep-label">Date</label>
      <input class="ep-input" id="jpDate" type="date">
    </div>
  </div>
  <div class="edit-panel-footer">
    <button class="ep-btn-delete" id="jpDeleteBtn" onclick="deleteJalon()" style="display:none">🗑 Supprimer</button>
    <button class="ep-btn-cancel" onclick="closeJalonPanel()">Annuler</button>
    <button class="ep-btn-save" onclick="saveJalonPanel()">✓ Enregistrer</button>
  </div>
</div>
<!-- PPTX Warning Modal -->
<div id="pptxModal" style="display: none; position: fixed; inset: 0px; z-index: 10000; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(3px); align-items: center; justify-content: center;">
  <div style="background: var(--surface); border-top: 4px solid var(--accent); border-radius: 8px; padding: 28px 32px; max-width: 440px; width: 90%; box-shadow: rgba(0, 0, 0, 0.35) 0px 12px 40px; font-family: Arial, sans-serif;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
      <span style="font-size:28px;flex-shrink:0;">⚠️</span>
      <div>
        <div style="font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px;">Gantt trop long pour une seule slide</div>
        <div style="font-size: 12px; color: var(--muted);" id="pptxModalDesc"></div>
      </div>
    </div>
    <div style="background: rgba(236, 114, 6, 0.08); border: 1px solid rgba(236, 114, 6, 0.25); border-radius: 5px; padding: 10px 14px; margin-bottom: 20px; font-size: 12px; color: var(--text); line-height: 1.6;" id="pptxModalDetail"></div>
    <div style="font-size: 11px; color: var(--muted); margin-bottom: 20px;">Vous pouvez continuer — le Gantt sera réparti automatiquement sur plusieurs slides.</div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="closePptxModal()" style="font-family: Arial, sans-serif; font-size: 12px; font-weight: 600; padding: 8px 18px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface2); color: var(--text); cursor: pointer;">Annuler</button>
      <button onclick="confirmPptxExport()" style="font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; padding: 8px 18px; border: medium; border-radius: 4px; background: var(--accent); color: rgb(255, 255, 255); cursor: pointer;">Continuer l'export</button>
    </div>
  </div>
</div>

<div id="viewProjets">
<div class="app-shell">
  <div class="nav-sidebar" id="navSidebar">
    <div class="nav-header">
      <span class="nav-header-title">📁 Portefeuille</span>
      <span class="nav-toggle" id="navToggle" onclick="toggleNav()" title="Réduire">‹</span>
    </div>
    <button class="nav-new-btn" onclick="createNewProjectPrompt()">
      <span>+</span><span class="nav-btn-text">Nouveau client</span>
    </button>
    <div class="nav-list" id="navList"></div>
  </div>
  <div class="app-content">
    <main>
      <div class="gantt-topbar">
        <div class="section-title" style="margin-bottom:0;border-left:none;padding-left:0;">| DIAGRAMME DE GANTT</div>
        <div class="gantt-toolbar" id="ganttToolbar">
          <button class="btn-ghost" id="btnJour" onclick="setView('jour')">Jour</button>
          <button class="btn-ghost active" id="btnSemaine" onclick="setView('semaine')">Semaine</button>
          <button class="btn-ghost" id="btnMois" onclick="setView('mois')">Mois</button>
          <button class="btn-ghost" id="btnResources" onclick="toggleResources()" title="Afficher ressources">👥 Ressources</button>
          <button class="btn-ghost" id="btnSyncCharges" onclick="syncGanttFromResources()" title="Synchroniser les charges depuis l'onglet Ressources">⟳ Sync charges</button>
          <div class="sep"></div>
          <div class="zoom-bar">
            <button onclick="changeZoom(-1)">−</button>
            <span id="zoomLevel">6</span><span style="font-size:8px;color:var(--muted);" id="zoomUnit">px/j</span>
            <button onclick="changeZoom(1)">+</button>
          </div>
          <div class="sep"></div>
          <button class="btn-ghost" onclick="exportPPTX()" style="color:var(--accent);border-color:var(--accent);" title="Exporter en PPTX">📌 PPTX</button>
          <label for="fileInput" style="cursor:pointer;padding:6px 12px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-weight:600;background:var(--surface2);display:inline-flex;align-items:center;color:var(--text);" title="Importer un fichier">📂 Importer</label>
          <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.xml" style="display:none">
          <div class="sep"></div>
          <button class="btn-ghost btn-cancel-edits" id="btnCancelEdits" onclick="cancelGanttEdits()" disabled title="Annuler les modifications">✕</button>
          <button class="btn-ghost btn-save-edits" id="btnSaveEdits" onclick="saveGanttEdits()" disabled title="Sauvegarder les modifications">💾</button>
        </div>
      </div>
      <div class="gantt-card">
        <div class="gantt-layout" id="ganttLayout"></div>
        <div class="legend" id="legend"></div>
      </div>
    </main>
  </div>
</div>
</div>

<div id="viewRessources" style="display:none; height:calc(100vh - var(--header-h)); overflow:hidden;"></div>

<div class="edit-panel" id="affectPanel">
  <div class="edit-panel-header">
    <span class="edit-panel-title" id="affectPanelTitle">👥 Affectations</span>
    <button class="edit-panel-close" onclick="closeAffectPanel()">✕</button>
  </div>
  <div class="edit-panel-body" style="padding:0">
    <div id="affectTotals" class="affect-totals"></div>
    <div id="affectList" class="affect-list"></div>
  </div>
  <div class="edit-panel-footer">
    <button class="ep-btn-save" onclick="affectAddRow()">+ Ajouter une ressource</button>
    <button class="ep-btn-cancel" onclick="closeAffectPanel()">Fermer</button>
  </div>
</div>

<script src="scripts/xml_import.js"></script>
<script src="scripts/utils.js"></script>
<script src="scripts/data.js"></script>
<script src="scripts/gantt.js"></script>
<script src="scripts/ui.js"></script>
<script src="scripts/resources.js"></script>
<script src="scripts/router.js"></script>
<script src="scripts/app.js"></script>
</body></html>
